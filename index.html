
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
            padding: 20px;
            background-color: #f0f4f8;
        }

        h1 {
            color: #1e3a8a;
        }

        input, button {
            padding: 10px;
            margin: 8px;
        }

        input {
            border: 1px solid #cbd5e1;
            border-radius: 5px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
        }

        .weak {
            color: #ff0000 !important;
        }

        .medium {
            color: #ff8c00 !important;
        }

        .strong {
            color: #008000 !important;
        }

        .meter-container {
            max-width: 350px;
            margin: 20px auto;
        }

        .meter-background {
            width: 100%;
            height: 14px;
            background-color: #d1d5db;
            border-radius: 10px;
            overflow: hidden;
        }

        #strengthBar {
            width: 0%;
            height: 100%;
            background-color: #dc2626;
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        #strengthLabel {
            font-weight: bold;
            margin-top: 8px;
        }

        .requirements {
            display: inline-block;
            text-align: left;
            margin-top: 15px;
            padding: 15px 25px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .requirements p {
            margin: 10px 0;
        }

        .passed {
            color: #008000;
        }

        .failed {
            color: #dc2626;
        }
    </style>
</head>

<body>
    <h1>Password Strength Checker</h1>

    <p>Enter a password to check its strength.</p>

    <input
        type="password"
        id="password"
        placeholder="Enter password"
    >

    <button onclick="togglePassword(this)">
        Show Password
    </button>

    <br>

    <button onclick="checkPassword()">Check Strength</button>

    <p id="result"></p>

    <div class="meter-container">
        <div class="meter-background">
            <div id="strengthBar"></div>
        </div>
        <p id="strengthLabel">Strength meter: Not checked</p>
    </div>

    <div class="requirements">
        <h3>Password requirements</h3>

        <p id="length" class="failed">✗ At least 8 characters</p>
        <p id="uppercase" class="failed">✗ An uppercase letter (A-Z)</p>
        <p id="lowercase" class="failed">✗ A lowercase letter (a-z)</p>
        <p id="number" class="failed">✗ A number (0-9)</p>
        <p id="symbol" class="failed">✗ A special character (!@#$)</p>
    </div>

    <script>
        function checkPassword() {
            let password = document.getElementById("password").value;
            let result = document.getElementById("result");
            let strengthBar = document.getElementById("strengthBar");
            let strengthLabel = document.getElementById("strengthLabel");

            let hasLength = password.length >= 8;
            let hasUppercase = /[A-Z]/.test(password);
            let hasLowercase = /[a-z]/.test(password);
            let hasNumber = /[0-9]/.test(password);
            let hasSymbol = /[^A-Za-z0-9]/.test(password);

            updateRequirement("length", hasLength, "At least 8 characters");
            updateRequirement("uppercase", hasUppercase, "An uppercase letter (A-Z)");
            updateRequirement("lowercase", hasLowercase, "A lowercase letter (a-z)");
            updateRequirement("number", hasNumber, "A number (0-9)");
            updateRequirement("symbol", hasSymbol, "A special character (!@#$)");

            let score = 0;

            if (hasLength) score++;
            if (hasUppercase) score++;
            if (hasLowercase) score++;
            if (hasNumber) score++;
            if (hasSymbol) score++;

            strengthBar.style.width = (score * 20) + "%";

            if (score <= 2) {
                result.textContent = "Weak password";
                result.className = "weak";
                strengthBar.style.backgroundColor = "#dc2626";
                strengthLabel.textContent = "Strength: Weak";
                strengthLabel.style.color = "#dc2626";
            } else if (score <= 4) {
                result.textContent = "Medium password";
                result.className = "medium";
                strengthBar.style.backgroundColor = "#f59e0b";
                strengthLabel.textContent = "Strength: Medium";
                strengthLabel.style.color = "#f59e0b";
            } else {
                result.textContent = "Strong password";
                result.className = "strong";
                strengthBar.style.backgroundColor = "#16a34a";
                strengthLabel.textContent = "Strength: Strong";
                strengthLabel.style.color = "#16a34a";
            }
        }

        function updateRequirement(id, passed, description) {
            let item = document.getElementById(id);

            if (passed) {
                item.textContent = "✓ " + description;
                item.className = "passed";
            } else {
                item.textContent = "✗ " + description;
                item.className = "failed";
            }
        }

        function togglePassword(button) {
            let password = document.getElementById("password");

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "Hide Password";
            } else {
                password.type = "password";
                button.textContent = "Show Password";
            }
        }
    </script>
</body>
</html>
