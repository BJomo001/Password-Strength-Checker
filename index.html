<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="icon" type="image/x-icon" href="Images/favicon.ico">
    <link rel="stylesheet" href="design.css">
</head>
<body>

    <h1>Password Strength Checker</h1>

    <p>Enter a password to check its strength.</p>

   <div class="input-group">
    <input type="password" id="password" placeholder=" ">
    <label for="password">Enter password</label>    
   </div>

    <button onclick="togglePassword(this)">
        Show Password
    </button>

    <br>

    <button onclick="checkPassword()">Check Strength</button>

    <p id="result"></p>

    <div class="meter-container">
        <div class="meter-background">
            <div id="strengthBar"></div>
        </div>
        <p id="strengthLabel">Strength meter: Not checked</p>
    </div>

    <div class="requirements">

        <h3>Password requirements</h3>

        <p id="length" class="failed">✗ At least 8 characters</p>
        <p id="uppercase" class="failed">✗ An uppercase letter (A-Z)</p>
        <p id="lowercase" class="failed">✗ A lowercase letter (a-z)</p>
        <p id="number" class="failed">✗ A number (0-9)</p>
        <p id="symbol" class="failed">✗ A special character (!@#$)</p>
    </div>  
   
<script src="logic.js"></script>    
</body>
</html>
